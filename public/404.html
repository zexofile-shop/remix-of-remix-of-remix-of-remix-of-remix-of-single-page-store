<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting... | ZexoFile Shop</title>
    <script type="text/javascript">
        // GitHub Pages SPA redirect script (works for normal routes + /~oauth callback)
        (function () {
            var l = window.location;
            var fullPath = l.pathname + l.search + l.hash;
            var encoded = encodeURIComponent(fullPath);

            sessionStorage.setItem('spa-redirect', encoded);
            l.replace(l.protocol + '//' + l.host + '/?p=' + encoded);
        })();
    </script>
</head>
<body>
    <noscript>
        <meta http-equiv="refresh" content="0; url=/" />
    </noscript>
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:system-ui,sans-serif;background:#0a0a0a;color:#fff;">
        <div style="text-align:center;">
            <div style="width:40px;height:40px;border:3px solid #7c3aed;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px;"></div>
            <p>Redirecting...</p>
        </div>
    </div>
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</body>
</html>
